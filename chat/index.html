<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
  <title>Chat — Model A</title>
  <meta name="description" content="Ngobrol dengan Model A — model kecil terlatih dari data terkurasi manusia dan model besar.">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
    .typing-cursor::after { content: '▋'; margin-left: 2px; animation: blink 1s steps(2) infinite; color: #999; }
    @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    .shimmer-chat { display: inline-flex; align-items: center; gap: 6px; color: #9ca3af; font-size: 14px; }
    .shimmer-chat span { background: linear-gradient(90deg, #b9b9b9 25%, #737373 50%, #b9b9b9 75%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .md-content p { margin: 0 0 0.65em; } .md-content p:last-child { margin-bottom: 0; }
    .md-content ul { margin: 0.4em 0 0.65em; padding-left: 1.2em; list-style: disc; }
    .md-content li { margin: 0.15em 0; }
    .md-content strong { font-weight: 700; }
    .md-content pre { background: #f3f4f6; border-radius: 12px; padding: 12px 14px; overflow-x: auto; font-size: 13px; margin: 0.5em 0; }
    .md-content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .md-content :not(pre) > code { background: #f3f4f6; border-radius: 6px; padding: 1px 5px; font-size: 0.9em; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden bg-white selection:bg-gray-200">

  <!-- Header melayang persis gaya chat Clincoo -->
  <header class="fixed top-0 left-0 right-0 z-30 px-3 pt-3 pointer-events-none flex justify-between items-center">
    <a href="/" class="pointer-events-auto flex-shrink-0 flex items-center justify-center text-[#222222] bg-white shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-gray-100 hover:text-black hover:bg-gray-100 transition-all rounded-full w-11 h-11" aria-label="Kembali">
      <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </a>
    <div class="pointer-events-auto inline-flex items-center gap-2 bg-white shadow-[0_4px_24px_rgba(0,0,0,0.10)] border border-gray-100/80 rounded-full pl-2 pr-3.5 h-11">
      <div class="w-7 h-7 rounded-full bg-black text-white flex items-center justify-center font-extrabold text-[11px]">A</div>
      <div class="leading-tight">
        <p class="text-[13px] font-bold text-gray-900">Model A</p>
        <p class="text-[10px] text-gray-400 font-medium">model kecil terlatih</p>
      </div>
    </div>
  </header>

  <!-- Area pesan -->
  <main id="chat-container" class="flex-1 overflow-y-auto px-4 pt-[80px] pb-40 space-y-4 w-full relative z-10">
    <!-- Sambutan -->
    <div id="welcome" class="h-full flex flex-col items-center justify-center text-center gap-3 py-16">
      <div class="w-14 h-14 rounded-2xl bg-black text-white flex items-center justify-center font-extrabold text-xl shadow-lg">A</div>
      <h1 class="text-xl font-extrabold tracking-tight">Mau tanya apa?</h1>
      <p class="text-sm text-gray-500 max-w-xs leading-relaxed">Aku menjawab dari pengetahuan yang dikurasi manusia. Kalau aku belum dilatih untuk sesuatu, aku akan bilang jujur.</p>
      <div id="suggestion-chips" class="flex flex-wrap items-center justify-center gap-2 mt-2 max-w-sm"></div>
    </div>
  </main>

  <!-- Composer persis gaya chat Clincoo -->
  <footer class="fixed bottom-0 left-0 right-0 w-full bg-transparent px-4 py-4 z-20 pointer-events-none flex flex-col justify-end">
    <div class="w-full bg-white rounded-[26px] shadow-[0_4px_24px_rgba(0,0,0,0.10)] p-4 sm:p-5 transition-all text-left border border-gray-100/80 pointer-events-auto max-w-4xl mx-auto">
      <textarea
        id="prompt-input"
        rows="1"
        placeholder="Tanya apa saja..."
        class="w-full resize-none border-0 bg-transparent p-0 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-0 text-[15px] sm:text-base md:text-lg leading-relaxed max-h-[140px] overflow-hidden custom-scrollbar"
      ></textarea>
      <div class="flex items-center justify-between pt-2">
        <p class="text-[11px] text-gray-400 pl-1 select-none">dijawab dari data latihan terkurasi</p>
        <button id="submit-btn" class="w-10 h-10 bg-black text-white rounded-full hover:bg-gray-800 transition-all duration-200 active:scale-90 flex items-center justify-center cursor-pointer shadow-sm hover:shadow-md shrink-0 disabled:opacity-40" aria-label="Kirim">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
        </button>
      </div>
    </div>
  </footer>

  <script>
  (function () {
    var input = document.getElementById('prompt-input');
    var container = document.getElementById('chat-container');
    var welcome = document.getElementById('welcome');
    var submitBtn = document.getElementById('submit-btn');
    var sending = false;

    function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
    function escAttr(t) { return esc(t).replace(/\r?\n/g, ' '); }

    // markdown sederhana: tebal, list, kode
    function md(text) {
      var t = esc(text);
      t = t.replace(/```([\s\S]*?)```/g, function (_, code) { return '<pre><code>' + code.trim() + '</code></pre>'; });
      t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/(^|\n)((?:[-•] .+(?:\n|$))+)/g, function (m, pre, block) {
        var items = block.trim().split(/\n/).map(function (l) { return '<li>' + l.replace(/^[-•] /, '') + '</li>'; }).join('');
        return pre + '<ul>' + items + '</ul>';
      });
      return t.split(/\n{2,}/).map(function (p) { return '<p>' + p.replace(/\n/g, '<br>') + '</p>'; }).join('');
    }

    function scrollToBottom() { container.scrollTop = container.scrollHeight; }
    function clearWelcome() { if (welcome) { welcome.remove(); welcome = null; } }

    function addUser(text) {
      clearWelcome();
      var el = document.createElement('div');
      el.className = 'flex flex-col items-end max-w-[85%] w-full pointer-events-auto ml-auto fade-in';
      el.innerHTML = '<div class="bg-gray-100 text-black px-4 py-2.5 rounded-2xl rounded-br-sm text-[15px] leading-relaxed inline-block w-fit md-content" style="word-break:break-word;overflow-wrap:break-word;">' + md(text) + '</div>';
      container.appendChild(el);
      scrollToBottom();
    }

    function addThinking() {
      var el = document.createElement('div');
      el.className = 'flex w-full fade-in';
      el.id = 'thinking-msg';
      el.innerHTML = '<div class="text-[15px]"><div class="shimmer-chat"><span>Model A sedang mencocokkan pertanyaan ke data latihannya…</span></div></div>';
      container.appendChild(el);
      scrollToBottom();
      return el;
    }

    function addAi(logId, reply, trained, match) {
      var el = document.createElement('div');
      el.className = 'flex max-w-[95%] sm:max-w-[90%] w-full min-w-0 fade-in';
      var matchNote = match
        ? '<div class="mt-1.5 flex items-center gap-1.5 text-[11px] text-gray-400"><i class="ph ph-database text-[12px]"></i>cocok dengan data latihan' + (match.source === 'model' ? ' (sumber: model besar, dikurasi manusia)' : '') + '</div>'
        : '';
      el.innerHTML = '<div class="flex flex-col gap-2 pt-1 w-full min-w-0">'
        + '<div class="text-black text-[15px] leading-normal break-words w-full md-content" style="word-break:break-word;overflow-wrap:break-word;">' + md(reply) + '</div>'
        + matchNote
        + '<div class="flex items-center gap-3 mt-1" data-log="' + logId + '">'
        + '<button type="button" class="copy-btn relative text-gray-400 hover:text-black transition p-1" title="Salin"><i class="ph ph-copy text-lg"></i></button>'
        + '<button type="button" class="thumb-btn text-gray-400 hover:text-black transition p-1" data-rating="1" title="Jawaban bagus"><i class="ph ph-thumbs-up text-lg"></i></button>'
        + '<button type="button" class="thumb-btn text-gray-400 hover:text-black transition p-1" data-rating="-1" title="Jawaban kurang"><i class="ph ph-thumbs-down text-lg"></i></button>'
        + '</div></div>';
      container.appendChild(el);
      el.querySelector('.copy-btn').addEventListener('click', function () {
        navigator.clipboard && navigator.clipboard.writeText(reply);
        this.innerHTML = '<i class="ph ph-check text-lg"></i>';
        var b = this; setTimeout(function () { b.innerHTML = '<i class="ph ph-copy text-lg"></i>'; }, 1500);
      });
      el.querySelectorAll('.thumb-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          el.querySelectorAll('.thumb-btn').forEach(function (x) { x.classList.remove('text-black'); });
          this.classList.add('text-black');
          fetch('/api/chat', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: logId, rating: Number(this.getAttribute('data-rating')) }) }).catch(function () {});
        });
      });
      scrollToBottom();
    }

    function send() {
      var text = String(input.value || '').trim();
      if (!text || sending) return;
      sending = true;
      submitBtn.disabled = true;
      input.value = '';
      autoGrow();
      addUser(text);
      var think = addThinking();
      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      }).then(function (r) {
        return r.ok ? r.json() : r.json().catch(function () { return {}; }).then(function (j) { return Promise.reject(j.error || 'Gagal mengirim'); });
      }).then(function (j) {
        think.remove();
        addAi(j.id, j.reply, j.trained, j.match);
      }).catch(function (err) {
        think.remove();
        addAi(null, 'Maaf, ada kendala teknis saat menjawab (' + esc(err || '') + '). Coba kirim ulang pesanmu.', false, null);
      }).finally(function () {
        sending = false;
        submitBtn.disabled = false;
        input.focus();
      });
    }

    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    }

    submitBtn.addEventListener('click', send);
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); send(); }
    });

    // Saran pertanyaan dari data latihan terbaik
    fetch('/api/data').then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.items || !j.items.length) return;
      var chipWrap = document.getElementById('suggestion-chips');
      if (!chipWrap) return;
      var picks = j.items.filter(function (it) { return it.rating === 1; }).slice(0, 3);
      if (!picks.length) picks = j.items.slice(0, 3);
      picks.forEach(function (it) {
        var b = document.createElement('button');
        b.className = 'px-3.5 py-1.5 rounded-full border border-gray-200 text-xs font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors';
        b.textContent = it.prompt.length > 40 ? it.prompt.slice(0, 40) + '…' : it.prompt;
        b.addEventListener('click', function () { input.value = it.prompt; send(); });
        chipWrap.appendChild(b);
      });
    }).catch(function () {});
  })();
  </script>
</body>
</html>
